[tools]
"go:github.com/itzg/rcon-cli" = "latest"
java = "21"

[tasks.clean_dist]
description = "Clean build files"
dir = "{{env.star_t_data_dir}}"
run = "rm -rf {{env.star_t_data_dir}}/mods/komarubrowser-*.jar {{env.star_t_client_dir}}/mods/komarubrowser-*.jar"

[tasks.dump_json]
description = "Dump ingredients.json & recipe.json"
depends = [":copy"]
sources = [
  "{{env.star_t_data_dir}}/mods/komarubrowser-*.jar",
  "./dump_jsons.sh",
]
outputs = [
  "{{env.dumps_from_mod_dir}}/*.json",
]
run = "./dump_jsons.sh"

[tasks.clean_artifacts]
description = "Cleanup"
dir = "{{env.star_t_data_dir}}"
run = "rm -rf {{env.dumps_from_mod_dir}}"

